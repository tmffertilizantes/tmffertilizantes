name: Release & Deploy Homolog

# Dispara a cada push na main: calcula a próxima versão semântica, versiona
# o package.json, cria a tag + Release no GitHub, builda o export estático
# do Next com a API_URL de homologação e publica no projeto de homologação
# do Cloudflare Pages via Wrangler.
#
# Importante: o projeto de homologação no Cloudflare Pages precisa estar
# com o deploy automático por Git DESLIGADO (Settings > Builds & deployments
# > Disable automatic deployments), já que agora quem builda e publica é
# este workflow — caso contrário cada push dispara dois deploys em paralelo
# (um do Cloudflare, outro deste workflow) e um pode sobrescrever o outro.

on:
  push:
    branches:
      - main

concurrency:
  group: tmf-frontend-homolog
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: homolog
    outputs:
      tag: ${{ steps.semver.outputs.next }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Next Version
        id: semver
        uses: ietf-tools/semver-action@v1
        with:
          token: ${{ github.token }}
          branch: main

      - name: Update package.json version
        run: |
          jq '.version = "${{ steps.semver.outputs.next }}"' package.json > temp.json && mv temp.json package.json

      - name: Push tag
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "release: ${{ steps.semver.outputs.next }}"
          git tag ${{ steps.semver.outputs.next }}
          git push origin main --tags

      - name: Create Release
        uses: ncipollo/release-action@v1.12.0
        with:
          tag: ${{ steps.semver.outputs.next }}
          allowUpdates: true
          draft: false
          makeLatest: true
          generateReleaseNotes: true
          name: ${{ steps.semver.outputs.next }}
          body: Changelog Contents
          token: ${{ github.token }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"

      - name: Install dependencies
        run: npm ci

      - name: Build (homolog)
        env:
          API_URL: ${{ secrets.API_URL }}
        run: npm run build

      - name: Deploy to Cloudflare Pages (homolog)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=${{ secrets.CF_PAGES_PROJECT_NAME }} --branch=main
